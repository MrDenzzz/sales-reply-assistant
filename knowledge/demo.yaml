# Демо-база знаний вымышленного магазина. Все товары, цены и условия придуманы.
# Формат: company — профиль компании, examples — готовые сценарии для демо-интерфейса,
# entries — факты (product / policy / promo). related — с чем товар логично сочетается,
# pinned: true — запись всегда попадает в контекст модели (например, действующие акции).

company:
  name: Травница
  description: интернет-магазин натуральных продуктов для здоровья и мягкого очищения организма

examples:
  - title: Доставка и оплата
    text: Здравствуйте! Хочу заказать клетчатку псиллиум. Сколько будет идти доставка в Казань и можно ли оплатить при получении?
  - title: Что ещё посоветуете
    text: Добрый день! Беру витамин D на зиму. Что ещё посоветуете для поддержки иммунитета?
  - title: Беременность
    text: Здравствуйте, я на 5 месяце беременности. Можно мне пить ваш пробиотик и чай «Лёгкость»?
  - title: Жалоба
    text: Получила заказ, а у банки с клетчаткой треснула крышка, половина порошка рассыпалась. Я очень недовольна!
  - title: Нет в базе
    text: Есть ли у вас коллаген для суставов?
  - title: Обещание лечения
    text: Ваш набор «Лёгкий старт» вылечит мне гастрит? Сколько нужно пить?

entries:
  # ---------- Товары ----------
  - id: psyllium-fiber
    type: product
    title: Клетчатка «Псиллиум»
    price_rub: 890
    content: >-
      Порошок из оболочки семян подорожника, 300 г — хватает на 30 дней.
      Источник растворимой пищевой клетчатки, помогает поддерживать регулярное пищеварение и дольше
      сохранять чувство сытости. Приём: 1 чайная ложка в стакане воды 1–2 раза в день, после
      обязательно выпить ещё стакан воды. Удобнее всего размешивать в шейкере.
      Противопоказания: индивидуальная непереносимость, непроходимость кишечника.
    related: [shaker, flora-probiotic, easy-start-kit]

  - id: flora-probiotic
    type: product
    title: Пробиотик «Флора Баланс»
    price_rub: 1290
    content: >-
      30 капсул, курс 30 дней. 10 млрд КОЕ лакто- и бифидобактерий в капсуле, устойчивой к желудочному
      соку. Поддерживает баланс микрофлоры кишечника. Приём: 1 капсула в день во время еды.
      Хранить при температуре до +25 °C.
    related: [psyllium-fiber, easy-start-kit]

  - id: easy-tea
    type: product
    title: Фиточай «Лёгкость»
    price_rub: 450
    content: >-
      Травяной сбор из ромашки, мяты, фенхеля и шиповника, 20 фильтр-пакетов. Без кофеина.
      Мягко поддерживает пищеварение, приятен вечером. Заваривать 1 пакет на 200 мл горячей воды,
      5–7 минут, 1–2 чашки в день.
    related: [psyllium-fiber, easy-start-kit]

  - id: easy-start-kit
    type: product
    title: Набор «Лёгкий старт 30 дней»
    price_rub: 2240
    content: >-
      Клетчатка «Псиллиум», пробиотик «Флора Баланс» и фиточай «Лёгкость» — всё для месячной программы
      мягкого очищения и поддержки пищеварения. По отдельности товары стоят 2 630 ₽, в наборе дешевле
      на 15% — 2 240 ₽. В комплекте памятка с графиком приёма.
    related: [shaker]

  - id: vitamin-d3
    type: product
    title: Витамин D3 2000 МЕ
    price_rub: 590
    content: >-
      60 мягких капсул на масляной основе, курс 2 месяца. Поддерживает иммунитет, здоровье костей
      и мышц — особенно актуален осенью и зимой, когда мало солнца. Приём: 1 капсула в день во время
      еды. Витамин D жирорастворимый: лучше усваивается вместе с жирами, например с омега-3.
    related: [omega-3, magnesium-b6]

  - id: omega-3
    type: product
    title: Омега-3 1000 мг
    price_rub: 1190
    content: >-
      60 капсул рыбьего жира из дикой северной рыбы, 60% омега-3 (EPA и DHA), курс 30 дней.
      Поддерживает сердце, сосуды, работу мозга и зрение. Приём: 2 капсулы в день во время еды.
      Без рыбного привкуса.
    related: [vitamin-d3]

  - id: magnesium-b6
    type: product
    title: Магний цитрат + B6
    price_rub: 690
    content: >-
      60 таблеток, курс 30 дней. Магний в хорошо усваиваемой форме цитрата вместе с витамином B6.
      Помогает справляться со стрессом и усталостью, поддерживает нервную систему и сон.
      Приём: 2 таблетки в день, лучше вечером.
    related: [vitamin-d3]

  - id: chlorella
    type: product
    title: Хлорелла
    price_rub: 990
    content: >-
      120 таблеток из пресноводной микроводоросли хлореллы, курс 30 дней. Источник растительного белка,
      хлорофилла и железа. Приём: 4 таблетки в день, запивая водой.
    related: [psyllium-fiber]

  - id: shaker
    type: product
    title: Шейкер 600 мл
    price_rub: 390
    content: >-
      Шейкер с сеточкой-венчиком: клетчатка и порошки размешиваются без комков за 10 секунд.
      Пластик без BPA, мерная шкала, герметичная крышка.

  # ---------- Условия ----------
  - id: delivery
    type: policy
    title: Доставка
    content: >-
      Доставляем по всей России через СДЭК: до пункта выдачи или курьером. Москва и Санкт-Петербург —
      1–2 дня, другие города — 3–7 дней. Стоимость — 350 ₽, при заказе от 3 000 ₽ доставка бесплатная.
      Заказы, оформленные до 14:00 по Москве, отправляем в тот же день. Трек-номер приходит в SMS.

  - id: payment
    type: policy
    title: Оплата
    content: >-
      Оплатить можно на сайте картой или через СБП, а также при получении в пункте выдачи СДЭК —
      картой или наличными. При заказе от 5 000 ₽ доступна оплата частями: 4 платежа раз в 2 недели
      без переплаты.

  - id: returns
    type: policy
    title: Возврат и обмен
    content: >-
      Если товар пришёл повреждённым или с браком, бесплатно заменим его или вернём деньги —
      пришлите фото товара и упаковки в чат. Невскрытую упаковку надлежащего качества можно вернуть
      в течение 14 дней после получения. Деньги возвращаются в течение 3 рабочих дней после проверки.

  - id: quality
    type: policy
    title: Качество и документы
    content: >-
      Вся продукция — биологически активные добавки (БАД), не лекарственные средства. На каждый товар
      есть свидетельство о государственной регистрации (СГР), документы можно запросить у менеджера.
      Производство в России на площадках с сертификацией GMP.

  - id: health-safety
    type: policy
    title: Кому нужна консультация врача
    content: >-
      Перед приёмом любых БАД стоит проконсультироваться с врачом при беременности и кормлении грудью,
      хронических заболеваниях, приёме лекарств, а также детям до 14 лет. Продукты магазина не
      предназначены для лечения заболеваний и не заменяют назначенную врачом терапию.

  - id: nutritionist
    type: policy
    title: Бесплатная консультация нутрициолога
    content: >-
      Нутрициолог магазина бесплатно помогает подобрать продукты и схему приёма с учётом образа жизни
      и питания. Консультация в чате, ответ в течение рабочего дня. Нутрициолог не ставит диагнозы
      и не назначает лечение.

  - id: order-status
    type: policy
    title: Статус заказа
    content: >-
      После отправки клиент получает SMS с трек-номером СДЭК, по нему можно отследить посылку на сайте
      СДЭК. Если трек-номер не пришёл, менеджер проверит статус по номеру заказа или телефону.

  - id: loyalty
    type: policy
    title: Бонусная программа
    content: >-
      С каждого заказа возвращаем 5% бонусами. Бонусами можно оплатить до 30% следующего заказа.
      Бонусы действуют 12 месяцев.

  # ---------- Акции (всегда в контексте) ----------
  - id: promo-course
    type: promo
    title: Скидка на курс
    pinned: true
    content: >-
      При покупке 2 и более одинаковых товаров — скидка 10% на каждую упаковку. Удобно брать
      сразу на полный курс.

  - id: promo-subscription
    type: promo
    title: Подписка на регулярную доставку
    pinned: true
    content: >-
      Можно оформить подписку: заказ приходит автоматически раз в месяц со скидкой 10%. Отменить
      или перенести доставку можно в любой момент.
